version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "monthly"
    labels: ["dependencies", "github_actions"]

  # Maintain dependencies for Bun (the npm ecosystem can't update bun.lock)
  - package-ecosystem: "bun"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "monthly"
    labels: ["dependencies", "javascript"]
    # Packages that only work at matching versions. Bumped one at a time, each
    # PR failed CI or left a peer dependency unmet.
    groups:
      # The Cloudflare adapter peers on astro, markdown-satteri pins Astro's
      # internal helpers and satteri, and the adapter's Vite plugin pins
      # wrangler.
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "satteri"
          - "wrangler"
      # The Vite plugin decides which Tailwind actually builds the CSS.
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # Ultracite's presets enable rules from specific oxlint and oxfmt versions.
      lint:
        patterns:
          - "ultracite"
          - "oxlint"
          - "oxfmt"
      happy-dom:
        patterns:
          - "happy-dom"
          - "@happy-dom/*"
    ignore:
      # TypeScript 7 has no JS API, which `astro check` (@astrojs/check)
      # depends on.
      - dependency-name: "typescript"
        versions: [">= 7"]
